name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "LanDrop-${{ github.ref_name }}.zip"
          Compress-Archive -DestinationPath $zip -Path src/LanDrop/bin/Release/net35/LanDrop.exe, src/LanDrop/bin/Release/net35/LanDrop.exe.config, LICENSE
          gh release create ${{ github.ref_name }} $zip --generate-notes
